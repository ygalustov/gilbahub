services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gilba_app
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
      - ./assets:/var/www/assets:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: gilba
      DB_USERNAME: gilba
      DB_PASSWORD: gilba_secret
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: gilba_web
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./assets:/var/www/assets:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: gilba_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: gilba
      MYSQL_USER: gilba
      MYSQL_PASSWORD: gilba_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
